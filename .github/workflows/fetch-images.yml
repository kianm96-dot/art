name: Fetch painting images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data.js, scripts/fetch-images.mjs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || (git commit -m "그림 이미지 업데이트" && git push)
